<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Checkout — Chandra Bazzar</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="page-header" style="padding: 40px 0 32px; background: linear-gradient(135deg, var(--primary-950) 0%, var(--primary-900) 100%);">
    <div class="container" style="text-align: center;">
      <h1 style="color: white; font-size: 2.2rem;">📦 Express Checkout</h1>
      <p style="color: rgba(255,255,255,0.8); margin-top: 6px;">
        100% Secure 256-Bit SSL Encrypted Checkout
      </p>
    </div>
  </div>

  <div class="section" style="padding: 36px 0 70px;">
    <div class="container">
      <div id="checkoutContent">
        <div class="text-center" style="padding: 50px;">
          <div class="spinner" style="margin: auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Interactive Payment & Invoice Modal -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal" id="paymentModalContent" style="max-width: 620px; width: 95%;"></div>
  </div>

  <!-- Printable Invoice Hidden Container -->
  <div id="invoicePrintArea" style="display: none;"></div>

  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
