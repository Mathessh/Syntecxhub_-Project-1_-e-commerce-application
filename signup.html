<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Chandra Bazzar</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="auth-page">
    <div class="auth-card">
      <div style="font-size: 2.4rem; text-align: center; margin-bottom: 8px;">🌿</div>
      <h2>Create Account</h2>
      <p class="subtitle">Join Chandra Bazzar for farm-fresh groceries & exclusive offers</p>

      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="e.g. Priya Sharma" required autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="e.g. priya@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Mobile Number (Optional)</label>
          <input type="tel" id="phone" placeholder="e.g. +91 98765 43210" autocomplete="tel">
        </div>
        <div class="form-group">
          <label style="display:flex; justify-content:space-between; align-items:center;">
            <span>Password</span>
            <span style="font-size:0.75rem; color:var(--primary-700); cursor:pointer;" onclick="togglePasswordVisibility('password')">Show / Hide</span>
          </label>
          <input type="password" id="password" placeholder="Create a password (min 6 chars)" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary form-btn">Create Free Account ➔</button>
      </form>
      <p class="auth-link">Already have an account? <a href="/login.html">Login</a></p>
    </div>
  </div>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
