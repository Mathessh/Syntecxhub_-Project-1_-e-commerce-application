<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Chandra Bazzar</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="auth-page">
    <div class="auth-card">
      <div style="font-size: 2.4rem; text-align: center; margin-bottom: 8px;">🛒</div>
      <h2>Welcome Back 👋</h2>
      <p class="subtitle">Log in to order fresh groceries & track your deliveries</p>

      <!-- 1-Click Demo Logins -->
      <div class="demo-logins-box">
        <p>⚡ <b>1-Click Demo Login</b> (Instant Test)</p>
        <div class="demo-btns-row">
          <button type="button" class="btn-demo-pill" onclick="fillDemo('customer')">👤 Customer (Rahul)</button>
          <button type="button" class="btn-demo-pill" onclick="fillDemo('admin')">⚙️ Admin (Owner)</button>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="e.g. rahul@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label style="display:flex; justify-content:space-between; align-items:center;">
            <span>Password</span>
            <span style="font-size:0.75rem; color:var(--primary-700); cursor:pointer;" onclick="togglePasswordVisibility('password')">Show / Hide</span>
          </label>
          <input type="password" id="password" placeholder="Enter password (min 6 chars)" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary form-btn" id="loginSubmitBtn">Secure Login ➔</button>
      </form>
      <p class="auth-link">New to Chandra Bazzar? <a href="/signup.html">Create an Account</a></p>
    </div>
  </div>
  <div id="footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
